# agent-bootstrap guard: project-specific rules (human-edited; agents cannot change this file).
# The built-in rules already block .env files, keys, certificates, credential stores,
# Keychain reads and environment dumps. Add extra rules here, one per line:
#
#   path: <glob>        block file tools and shell commands touching matching paths
#   cmd: <regex>        block shell commands matching the regex (Python syntax)
#   allow-path: <glob>  exempt paths from the built-in path rules (e.g. test fixtures)
#
# Examples:
# path: config/production/*.yml
# path: infra/**/*.tfstate
# cmd: \bkubectl\s+get\s+secret\b
# cmd: \bheroku\s+config\b
# allow-path: tests/fixtures/*.pem
